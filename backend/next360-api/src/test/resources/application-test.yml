# Test profile — uses H2 in-memory
spring:
  datasource:
    url: jdbc:h2:mem:next360test
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      url: redis://localhost:6379
