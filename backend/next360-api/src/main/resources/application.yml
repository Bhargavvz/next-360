# ============================================================
# Next360 — Application Configuration
# ============================================================

spring:
  application:
    name: next360-api

  profiles:
    active: ${APP_ENV:dev}
    # APP_ENV is commonly set to "development"/"production"; map those onto the
    # dev/prod profile files so the right config is picked up either way.
    group:
      development: dev
      local: dev
      production: prod

  # Database
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/next360}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:Nani2005}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: none  # Flyway manages schema
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 5000

  # File uploads
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# Server
server:
  port: 8080
  servlet:
    context-path: /

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# Next360 custom config
next360:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:8081}
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-secure-secret-in-production}
    expiration: ${JWT_EXPIRATION:3600000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  commission:
    default-percentage: ${COMMISSION_DEFAULT_PERCENTAGE:15}
  s3:
    bucket: ${S3_BUCKET:next360-uploads-2402}
    region: ${AWS_REGION:ap-south-1}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    # Optional S3-compatible endpoint (MinIO/LocalStack). Blank = real AWS.
    endpoint: ${S3_ENDPOINT:}
    path-style-access: ${S3_PATH_STYLE:false}
    # Optional CDN/CloudFront origin used to build public URLs.
    public-base-url: ${S3_PUBLIC_BASE_URL:}
    # Presigned URL validity (seconds) for uploads and private downloads.
    presign-upload-ttl-seconds: ${S3_PRESIGN_UPLOAD_TTL:600}
    presign-download-ttl-seconds: ${S3_PRESIGN_DOWNLOAD_TTL:3600}
    max-file-size-bytes: ${S3_MAX_FILE_SIZE:10485760}
    # Folders whose objects are private and must be served via presigned URLs.
    private-folders: kyc,certificates
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    # Secret configured on the Razorpay webhook (falls back to key-secret).
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    currency: INR
  payment:
    cod-enabled: ${COD_ENABLED:true}
    cod-max-order-amount: ${COD_MAX_ORDER_AMOUNT:20000}
  shipping:
    free-delivery-threshold: ${FREE_DELIVERY_THRESHOLD:499}
    delivery-fee: ${DELIVERY_FEE:49}
  otp:
    api-key: ${OTP_PROVIDER_KEY:}
    enabled: ${OTP_ENABLED:false}
    # 2factor.in template name (must be approved in the 2factor dashboard).
    template: ${OTP_TEMPLATE:AUTOGEN}
    ttl-seconds: ${OTP_TTL_SECONDS:300}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN:30}
    max-requests-per-window: ${OTP_MAX_REQUESTS:5}
    request-window-seconds: ${OTP_REQUEST_WINDOW:900}
    max-verify-attempts: ${OTP_MAX_VERIFY_ATTEMPTS:5}
    # Fixed OTP accepted when SMS delivery is not configured (local development).
    dev-otp: ${OTP_DEV_CODE:123456}
